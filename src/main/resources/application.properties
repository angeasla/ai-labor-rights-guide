# ===============================
# SHARED CONFIGURATION
# All environments load this file.
# Environment-specific overrides go in application-dev.properties / application-prod.properties
# ===============================

spring.application.name=ai-labor-rights-guide
server.port=8080

# ===============================
# ADMIN PROTECTION
# ===============================
admin.secret=${ADMIN_SECRET}

# ===============================
# DEEPSEEK AI
# ===============================
spring.ai.deepseek.api-key=${DEEPSEEK_API_KEY}
spring.ai.deepseek.chat.options.model=deepseek-chat

# ===============================
# CHROMA VECTOR DATABASE — shared settings
# ===============================
spring.ai.vectorstore.chroma.collection-name=labor_guide_v3
spring.ai.vectorstore.chroma.initialize-schema=true
