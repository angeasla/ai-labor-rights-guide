spring.application.name=ai-labor-rights-guide
# ===============================
# SERVER & CORS
# ===============================
server.port=8080
# Graceful shutdown: let in-flight requests (incl. long LLM calls) finish on SIGTERM/redeploy.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# ===============================
# PERFORMANCE / CONCURRENCY
# ===============================
# Virtual threads (Java 25). Workload is I/O-bound: chat blocks on the DeepSeek HTTP round-trip
# (often 2-3 sequential calls: search_articles -> get_article -> answer), search blocks on Meili.
# On virtual threads each request unmounts its carrier thread while blocked, so the ~200-thread
# Tomcat pool is no longer the concurrency ceiling AND a flood of slow chat calls can't starve the
# cheap /api/calc and /api/wiki endpoints (no shared-pool head-of-line blocking).
spring.threads.virtual.enabled=true
# Comma-separated allowed origins for the Angular frontend (overridable via env).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# ===============================
# DEEPSEEK AI CONFIGURATION
# ===============================
spring.ai.deepseek.api-key=${DEEPSEEK_API_KEY:}
spring.ai.deepseek.chat.options.model=deepseek-chat
# Cap completion length — output tokens are the most expensive; bounds worst-case cost per turn.
spring.ai.deepseek.chat.options.max-tokens=1000
# Disable Spring AI's default retry (max-attempts defaults to ~10). A retried turn multiplies LLM
# cost during a DeepSeek incident/rate-limit — exactly when you don't want it. 1 = one attempt, no retry.
spring.ai.retry.max-attempts=1

# ===============================
# MEILISEARCH (hybrid keyword + vector search)
# ===============================
# Server-side trusted key (master/admin) — used for both ingestion and search.
meilisearch.url=${MEILISEARCH_URL:http://localhost:7700}
meilisearch.key=${MEILISEARCH_KEY:${MEILI_MASTER_KEY:}}
meilisearch.index=articles
# Hybrid blend: 0.0 = pure keyword, 1.0 = pure semantic.
meilisearch.semantic-ratio=0.5
# Embedder name registered in the index settings (userProvided vectors from the local transformers model).
meilisearch.embedder=default

# ===============================
# CHAT RAG PROVIDER (LLM grounding only — the /api/search box ALWAYS uses Meilisearch)
# ===============================
# Which vector backend the chat's search_articles/get_article tools query: meili | chroma.
# Runtime-selectable (env APP_RAG_PROVIDER) for the Meili-hybrid-vs-Chroma trial; deployment runs both
# engines and ingestion populates both, so flipping this needs no re-index.
app.rag.provider=${APP_RAG_PROVIDER:meili}

# ChromaDB connection — used when app.rag.provider=chroma AND for dual-ingestion. Harmless otherwise.
# In docker-compose these point at the chromadb service; default to localhost for bare-metal dev.
spring.ai.vectorstore.chroma.client.host=${CHROMA_HOST:http://localhost}
spring.ai.vectorstore.chroma.client.port=${CHROMA_PORT:8000}
spring.ai.vectorstore.chroma.collection-name=${CHROMA_COLLECTION:labor_guide_v3}
spring.ai.vectorstore.chroma.initialize-schema=true

# ===============================
# LOCAL EMBEDDING MODEL (all-MiniLM-L6-v2) — local-first, download-fallback
# ===============================
# EmbeddingModelLocationPostProcessor resolves these to a local resource if present, else falls back
# to Spring AI's remote default (download). Removes the startup download dependency behind the proxy.
#   - tokenizer.json ships in the spring-ai-transformers jar (classpath) → never downloads.
#   - model.onnx (~90 MB) is NOT bundled: place it at the path below (mounted volume in Docker, or run
#     scripts/fetch-embedding-model.*). If missing, it downloads from the remote LFS URL.
app.embedding.model-path=${EMBEDDING_MODEL_PATH:models/all-MiniLM-L6-v2/model.onnx}
app.embedding.tokenizer-path=${EMBEDDING_TOKENIZER_PATH:classpath:/onnx/all-MiniLM-L6-v2/tokenizer.json}

# ===============================
# OUTBOUND HTTP CLIENT (DeepSeek LLM)
# ===============================
# Applies to Spring's auto-configured RestClient.Builder, which Spring AI's DeepSeek client uses for
# the blocking .call() path. Without a read timeout a hung/slow upstream parks the request thread
# until the socket dies. read-timeout is PER HTTP call; a chat turn may make several sequential calls
# (search_articles -> get_article -> answer), so the total turn can exceed this — keep nginx's
# proxy_read_timeout (120s) >= the worst-case sum. (Meilisearch uses its own client; it's on the
# internal network and fast.)
spring.http.client.connect-timeout=5s
spring.http.client.read-timeout=90s

# ===============================
# RATE LIMITING (per client IP; in-memory token buckets)
# ===============================
app.ratelimit.enabled=true
# Chat (LLM) — expensive in money + latency. Tiered: short burst, hourly, then a hard daily quota.
app.ratelimit.chat.per-minute=15
app.ratelimit.chat.burst=5
app.ratelimit.chat.per-hour=60
app.ratelimit.chat.per-day=300
# Exceeding per-day => temporary cooldown (NOT a permanent ban) + one alert log line per trigger.
app.ratelimit.chat.block-duration=1h
# Search — cheap but CPU-bound (local embedding). Per-IP per-minute ceiling.
app.ratelimit.search.per-minute=50
# Shared egress IPs (corporate NAT / VPN exit nodes) front many real users behind one address.
# List their CIDRs (comma-separated, IPv4 or IPv6) to grant shared-multiplier x the limits above.
# Example: app.ratelimit.shared-cidrs=195.20.0.0/16,2a01:4f8::/29
app.ratelimit.shared-cidrs=
app.ratelimit.shared-multiplier=20

# ===============================
# LLM GUARDRAILS (inbound payload guards)
# ===============================
# Cheap pre-LLM heuristic in chars, not tokens (~2.5 chars/token for Greek; approximate).
# Total chars across the conversation (≈ 8k tokens) — reject the turn past this.
app.chat.max-input-chars=20000
# Per single message (≈ 500 tokens); longer messages get truncated before the LLM.
app.chat.max-message-chars=1500

# ===============================
# LLM COST ACCOUNTING (daily-spend alert)
# ===============================
# Rates per 1,000,000 tokens. PLACEHOLDERS — verify against current DeepSeek pricing:
# https://api-docs.deepseek.com/quick_start/pricing
# input/output rates and the alert threshold MUST all use the same currency unit.
app.cost.input-per-1m-tokens=0.27
app.cost.output-per-1m-tokens=1.10
# Alert once/day when estimated spend crosses this; unit = same currency as the rates above.
app.cost.daily-alert-threshold=10.0
