# ===============================
# PROD ENVIRONMENT OVERRIDES
# Activate with: SPRING_PROFILES_ACTIVE=prod
# ===============================

# ChromaDB running as a Docker service named "chromadb" in the same network
spring.ai.vectorstore.chroma.client.host=http://chromadb
spring.ai.vectorstore.chroma.client.port=8000

# Swagger disabled in production — do not expose API structure publicly
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false
