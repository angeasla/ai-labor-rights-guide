# Local / offline profile.
# Boots lazily so the app starts even when the transformers embedder cannot initialise — it downloads
# its ONNX model from GitHub on first creation, which fails behind SSL-intercepting corporate proxies
# (and offline). Calculators (/api/calc) and the wiki (/api/wiki) work fully; search (/api/search) and
# chat need Meilisearch + the embedder + a DeepSeek key respectively and will error until those exist.
#
# Run:  java -jar target/ai-labor-rights-guide-0.0.1-SNAPSHOT.jar --spring.profiles.active=local
spring.main.lazy-initialization=true
