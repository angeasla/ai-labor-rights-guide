name: Backend CI

on:
  # Auto-trigger on push to main
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'Dockerfile'
      - '.github/workflows/backend-ci.yml'

  # Manual trigger — works from any branch via GitHub UI → Actions → Run workflow
  workflow_dispatch:

jobs:
  release:
    name: Version, Tag & Release
    runs-on: ubuntu-latest

    permissions:
      contents: write   # Required to create tags and GitHub releases
      packages: write   # Required to push to ghcr.io

    outputs:
      version: ${{ steps.semver.outputs.nextStrict }}
      should_release: ${{ steps.check.outputs.should_release }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history required for semver calculation

      # Calculates the next version from conventional commits since the last tag.
      # Commit prefixes:
      #   feat / feature   → minor bump  (1.0.0 → 1.1.0)
      #   fix / bugfix     → patch bump  (1.0.0 → 1.0.1)
      #   Custom major:    add "major:" to majorList for a major bump (1.0.0 → 2.0.0)
      # noVersionBumpBehavior: current → returns current version silently if no bumpable commits
      - name: Calculate next semantic version
        id: semver
        uses: ietf-tools/semver-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref_name }}
          majorList: major, breaking
          minorList: feat, feature
          patchList: fix, bugfix, perf, refactor
          noVersionBumpBehavior: warn
          noNewCommitBehavior: warn

      # Only create a release if the version actually changed
      - name: Check if version bumped
        id: check
        run: |
          if [ "${{ steps.semver.outputs.current }}" != "${{ steps.semver.outputs.next }}" ]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
          else
            echo "should_release=false" >> $GITHUB_OUTPUT
            echo "No version bump — skipping release and Docker build."
          fi

      - name: Create Git tag
        if: steps.check.outputs.should_release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag v${{ steps.semver.outputs.nextStrict }}
          git push origin v${{ steps.semver.outputs.nextStrict }}

      # Creates a GitHub Release with auto-generated notes from commit messages
      - name: Create GitHub Release
        if: steps.check.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.semver.outputs.nextStrict }}
          name: v${{ steps.semver.outputs.nextStrict }}
          generate_release_notes: true

  docker-build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.should_release == 'true'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GITHUB_TOKEN is provided automatically — no secrets to configure
      - name: Log in to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image will be tagged with:
      #   ghcr.io/<owner>/<repo>:latest
      #   ghcr.io/<owner>/<repo>:v1.2.3
      #   ghcr.io/<owner>/<repo>:abc1234  (git sha for traceability)
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=v${{ needs.release.outputs.version }}
            type=sha,prefix=,format=short

      # - name: Build and push Docker image
      #   uses: docker/build-push-action@v6
      #   with:
      #     context: .
      #     push: true
      #     tags: ${{ steps.meta.outputs.tags }}
      #     labels: ${{ steps.meta.outputs.labels }}
      #     cache-from: type=gha
      #     cache-to: type=gha,mode=max
