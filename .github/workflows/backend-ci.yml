name: Backend CI

on:
  # Auto-trigger on push to master
  push:
    branches: [ master ]
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker-compose*.yml'
      - 'scripts/**'
      - '.github/workflows/backend-ci.yml'

  # Validate proposed changes before they are merged; releases remain push-only.
  pull_request:
    branches: [ master ]
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker-compose*.yml'
      - 'scripts/**'
      - '.github/workflows/backend-ci.yml'

  # Manual trigger — tests any selected branch; releases are restricted to master.
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run tests
        run: ./mvnw -B test

  prepare-release:
    name: Calculate release version
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    permissions:
      contents: read

    outputs:
      version: ${{ steps.semver.outputs.nextStrict }}
      should_release: ${{ steps.check.outputs.should_release }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history required for semver calculation

      # Calculates the next version from conventional commits since the last tag.
      # Commit prefixes:
      #   feat / feature   → minor bump  (1.0.0 → 1.1.0)
      #   fix / bugfix     → patch bump  (1.0.0 → 1.0.1)
      #   Custom major:    add "major:" to majorList for a major bump (1.0.0 → 2.0.0)
      # noVersionBumpBehavior: current → returns current version silently if no bumpable commits
      - name: Calculate next semantic version
        id: semver
        uses: ietf-tools/semver-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref_name }}
          majorList: major, breaking
          minorList: feat, feature
          patchList: fix, bugfix, perf, refactor
          noVersionBumpBehavior: warn
          noNewCommitBehavior: warn

      # Only create a release if the version actually changed
      - name: Check if version bumped
        id: check
        run: |
          if [ "${{ steps.semver.outputs.current }}" != "${{ steps.semver.outputs.next }}" ]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
          else
            echo "should_release=false" >> $GITHUB_OUTPUT
            echo "No version bump — skipping release and Docker build."
          fi

  docker-build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: prepare-release
    if: needs.prepare-release.outputs.should_release == 'true'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GITHUB_TOKEN is provided automatically — no secrets to configure
      - name: Log in to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ai-labor-rights-backend
          tags: |
            type=raw,value=v${{ needs.prepare-release.outputs.version }}
            type=sha,prefix=,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create Git tag and release
    runs-on: ubuntu-latest
    needs: [prepare-release, docker-build]
    if: needs.prepare-release.outputs.should_release == 'true'

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ needs.prepare-release.outputs.version }}"
          git push origin "v${{ needs.prepare-release.outputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare-release.outputs.version }}
          name: v${{ needs.prepare-release.outputs.version }}
          generate_release_notes: true
